/* ===== Provas (IndexedDB) ===== */
let idb=null;
function openIDB(){return new Promise(res=>{try{const r=indexedDB.open('analise-recurso-47',1);r.onupgradeneeded=()=>r.result.createObjectStore('provas');r.onsuccess=()=>{idb=r.result;res(idb)};r.onerror=()=>res(null);}catch(e){res(null)}});}
function idbGet(id){return new Promise(res=>{if(!idb)return res(null);try{const q=idb.transaction('provas').objectStore('provas').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null)}});}
function idbPut(id,v){return new Promise(res=>{if(!idb)return res(false);try{const t=idb.transaction('provas','readwrite');t.objectStore('provas').put(v,id);t.oncomplete=()=>res(true);t.onerror=()=>res(false);}catch(e){res(false)}});}
function idbDel(id){try{if(idb)idb.transaction('provas','readwrite').objectStore('provas').delete(id);}catch(e){}}
const MEM={}; // fallback se IndexedDB indisponível

const fmt=n=>n.toFixed(2).replace('.',',');
const r2=n=>Math.round(n*100)/100;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

/* ===== Cálculo ===== */
function critCounts(A,it,c){
  if(A.c[it.id+'.'+c.id]!=='sim') return false;
  if(c.req && !c.req.every(x=>A.c[it.id+'.'+x]==='sim')) return false;
  if(c.reqAny && !c.reqAny.some(x=>A.c[it.id+'.'+x]==='sim')) return false;
  return true;
}
const pecaZerada=(A,it)=>it.grupo==='peca'&&A.gate==='outra';
function potencial(A,it){if(pecaZerada(A,it))return 0;return r2(Math.min(it.max,it.crits.reduce((s,c)=>s+(critCounts(A,it,c)?c.v:0),0)));}
const filled=(A,it)=>it.crits.every(c=>A.c[it.id+'.'+c.id]);
function recebida(A,it){const v=A.nota[it.id];return(v===undefined||v===''||v===null)?null:parseFloat(v);}
function status(A,it){
  const rec=recebida(A,it);
  if(pecaZerada(A,it)) return rec===null?'pend':'zero';
  if(!filled(A,it)||rec===null) return 'pend';
  const p=potencial(A,it);
  return p>rec+0.001?'rec':(p<rec-0.001?'acima':'ok');
}
function totals(A){
  let atual=0,pot=0,pend=0;
  ITEMS.forEach(it=>{const rec=recebida(A,it);if(rec===null){pend++;return;}atual+=rec;pot+=status(A,it)==='rec'?potencial(A,it):rec;});
  return{atual:r2(atual),pot:r2(pot),pend};
}

/* ===== Visualizador da prova ===== */
let zoom=1;
async function renderViewer(){
  const A=cur(),box=document.getElementById('vbox');if(!A||!box)return;
  let files=MEM[A.id]||(await idbGet(A.id));
  if(cur()!==A)return;
  const up=document.getElementById('vupload');
  if(!files||!files.length){
    box.innerHTML='<div class="drop">Anexe a prova de '+esc(A.nome)+' (fotos ou PDF) e o espelho individual, se tiver.<br><label class="btn pri small">Escolher arquivos<input type="file" id="file-in" multiple accept="image/*,application/pdf"></label></div>';
    up.style.display='none';return;
  }
  up.style.display='';
  box.innerHTML='';
  for(const f of files){
    const url=URL.createObjectURL(f.blob);
    if(f.type==='application/pdf'){
      if(!window.pdfjsLib){box.insertAdjacentHTML('beforeend','<div class="pg">'+esc(f.name)+': não foi possível abrir o PDF aqui. Converta em imagens ou verifique a internet.</div>');continue;}
      try{
        pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf=await pdfjsLib.getDocument({data:await f.blob.arrayBuffer()}).promise;
        for(let i=1;i<=pdf.numPages;i++){
          const page=await pdf.getPage(i),vp=page.getViewport({scale:1.6});
          const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
          await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
          box.insertAdjacentHTML('beforeend','<div class="pg">'+esc(f.name)+' · página '+i+'</div>');
          cv.style.width=(100*zoom)+'%';box.appendChild(cv);
        }
      }catch(e){box.insertAdjacentHTML('beforeend','<div class="pg">Não consegui abrir '+esc(f.name)+'.</div>');}
    } else {
      box.insertAdjacentHTML('beforeend','<div class="pg">'+esc(f.name)+'</div><img src="'+url+'" style="width:'+(100*zoom)+'%">');
    }
  }
}
async function addFiles(list){
  const A=cur();if(!A||!list.length)return;
  let files=MEM[A.id]||(await idbGet(A.id))||[];
  for(const f of list) files.push({name:f.name,type:f.type,blob:f});
  const ok=await idbPut(A.id,files);
  if(!ok){MEM[A.id]=files;toast('Prova anexada, mas este navegador não deixa salvar: ao recarregar, anexe de novo.',true);}
  renderViewer();
}

/* ===== Textos ===== */
function nomeItem(it){
  if(it.grupo==='peca'){const m=it.titulo.match(/^(\d+)\.\s*(.*)$/);return 'item '+m[1]+' ('+m[2]+') da peça profissional';}
  const m=it.titulo.match(/Questão (\d) · ([AB])/);return 'item '+m[2]+' da Questão '+m[1];
}
function recText(A,it){
  const p=potencial(A,it),rec=recebida(A,it),ok=it.crits.filter(c=>critCounts(A,it,c));
  const local='na página '+(A.pag[it.id]||'__')+', linhas '+(A.lin[it.id]||'__')+',';
  let t='Prezada Banca Examinadora,\n\nO(a) examinando(a) requer a revisão da nota atribuída ao '+nomeItem(it)+', que recebeu '+fmt(rec)+' de '+fmt(it.max)+' pontos.\n\n';
  t+='Conforme o padrão de respostas definitivo, o item exige: '+ok.map(c=>c.l.charAt(0).toLowerCase()+c.l.slice(1)+' ('+fmt(c.v)+')').join('; ')+'.\n\n';
  t+='Na resposta, '+local+' o(a) examinando(a) '+ok.map(c=>c.r).join('; e ')+'.';
  const tr=(A.trecho[it.id]||'').trim();if(tr)t+=' É o que se extrai do seguinte trecho: "'+tr+'".';
  t+='\n\nA resposta, portanto, contempla o conteúdo exigido no padrão de respostas, com o desenvolvimento do raciocínio jurídico e a indicação do fundamento legal, e não apenas a menção ao dispositivo.\n\nDiante do exposto, requer a majoração da nota do item para '+fmt(p)+' pontos.';

}

  if(recs.length){
    h+='<h2 style="font-size:19px;margin:16px 0 2px">Textos de recurso ('+recs.length+')</h2>';
    recs.forEach(it=>{h+='<div class="rec-item"><h3>'+(it.grupo==='peca'?'Peça · ':'')+it.titulo+'</h3><div class="gain">de '+fmt(recebida(A,it))+' para '+fmt(potencial(A,it))+' · +'+fmt(r2(potencial(A,it)-recebida(A,it)))+'</div><textarea id="txt-'+it.id+'">'+esc(recText(A,it))+'</textarea><div class="btns"><button class="btn pri small" data-copy="'+it.id+'">Copiar</button></div></div>';});
  }
  h+='<div class="panel tips" style="margin-top:14px"><h3>Mensagem para o aluno</h3><p style="font-size:13px;color:var(--muted);margin:0 0 6px">Resumo da análise com todos os textos de recurso, pronto para colar no WhatsApp. Se quiser, escreva um recado seu para ir no final.</p>'+
     '<textarea id="obs" placeholder="Recado seu (opcional)">'+esc(A.obs||'')+'</textarea><div class="btns"><button class="btn pri" id="copy-msg">Copiar mensagem para o aluno</button></div></div>';
  h+='<div class="panel tips"><h3>Orientações que vão na mensagem</h3><ul><li>Um recurso por item, no campo certo do sistema da FGV.</li><li>Sem nome, assinatura ou inscrição no texto: recurso identificado é indeferido.</li><li>Conferir página e linhas antes de enviar.</li></ul>'+
     '<div class="btns"><button class="del" id="del-aluno">Excluir este aluno</button></div></div>';
  R.innerHTML=h;
}
function updateAll(){
  const A=cur();if(!A)return;
  ITEMS.forEach(it=>updateItem(A,it));
  const t=totals(A),none=t.pend===ITEMS.length;
  document.getElementById('bar-atual').textContent=none?'–':fmt(t.atual);
  document.getElementById('bar-pot').textContent=none?'–':fmt(t.pot);
  const gm=document.getElementById('gate-msg');
  if(gm) gm.innerHTML=A.gate==='outra'?'<div class="alert bad">A peça cobrada foi o Recurso Ordinário. Peça inadequada zera a peça inteira, então só informe as notas da peça (devem estar 0,00) e siga para as questões.</div>':A.gate==='ro'?'<div class="alert good">Peça correta. Siga item por item.</div>':'';
  renderRes();renderAlunos();
}
function renderAll(){renderAlunos();renderArea();}

/* ===== Utilidades ===== */
function toast(msg,bad){const t=document.getElementById('toast');t.textContent=msg;t.style.background=bad?'#8A4B12':'';t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600);}
function copyText(txt){
  const fb=()=>{const el=document.createElement('textarea');el.value=txt;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.focus();el.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}el.remove();toast(ok?'Copiado':'Não deu para copiar. Selecione o texto manualmente.',!ok);};
  try{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(()=>toast('Copiado'),fb);else fb();}catch(e){fb();}
}

/* ===== Eventos ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const A=cur();
  if(b.id==='add-aluno')addAluno();
  else if(b.dataset.aluno){DB.atual=b.dataset.aluno;save();TAB='peca';renderAll();window.scrollTo({top:0});}
  else if(b.dataset.tab)setTab(b.dataset.tab,true);
  else if(b.dataset.gate&&A){A.gate=b.dataset.gate;if(A.gate==='outra')ITEMS.filter(i=>i.grupo==='peca').forEach(i=>A.nota[i.id]='0');save();renderArea();}
  else if(b.dataset.k&&A){A.c[b.dataset.k]=b.dataset.o;save();b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));updateAll();}
  else if(b.dataset.copy){copyText(document.getElementById('txt-'+b.dataset.copy).value);}
  else if(b.id==='copy-msg'&&A){copyText(msgAluno(A));}
  else if(b.id==='bar-go')setTab('res',true);
  else if(b.dataset.zoom)setZoom(zoom+(b.dataset.zoom==='+'?.25:-.25));
  else if(b.id==='limpar-prova'&&A){
    if(b.dataset.armed){idbDel(A.id);delete MEM[A.id];renderViewer();}
    else{b.dataset.armed='1';b.textContent='Toque de novo';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Remover prova';}},3500);}
  }
  else if(b.id==='del-aluno'&&A){
    if(b.dataset.armed){idbDel(A.id);DB.alunos=DB.alunos.filter(x=>x.id!==A.id);DB.atual=DB.alunos.length?DB.alunos[DB.alunos.length-1].id:null;save();renderAll();window.scrollTo({top:0});}
    else{b.dataset.armed='1';b.textContent='Toque de novo para excluir '+A.nome;setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Excluir este aluno';}},3500);}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='novo-nome')addAluno();});
document.addEventListener('change',e=>{
  const el=e.target,A=cur();
  if(el.id==='file-in'||el.id==='file-in2'){addFiles([...el.files]);el.value='';}
  else if(el.dataset.nota&&A){A.nota[el.dataset.nota]=el.value;save();updateAll();}
});
document.addEventListener('input',e=>{
  const el=e.target,A=cur();if(!A)return;
  if(el.dataset.pag!==undefined){A.pag[el.dataset.pag]=el.value;save();refreshTexts(A);}
  else if(el.dataset.lin!==undefined){A.lin[el.dataset.lin]=el.value;save();refreshTexts(A);}
  else if(el.dataset.tr!==undefined){A.trecho[el.dataset.tr]=el.value;save();refreshTexts(A);}
  else if(el.id==='obs'){A.obs=el.value;save();}
});
function refreshTexts(A){ITEMS.forEach(it=>{const ta=document.getElementById('txt-'+it.id);if(ta&&status(A,it)==='rec')ta.value=recText(A,it);});}

openIDB().then(renderAll);
</script>
